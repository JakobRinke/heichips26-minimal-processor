long-description: |
  The instruction set supports: ADDI (Add Immediate), BEZ (Branch if Zero), SWAP (Swap Register with RAM at Address)
  The Multicore supports n Cores and ensures Cache coherency and atomic concurrent access (no data loss) - a mutex can be implememted 

